<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Terminal prompt: "> _" in blue -->
  <!-- ">" chevron -->
  <polyline
    points="6,11 11,16 6,21"
    stroke="#60a5fa"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- cursor block -->
  <rect x="14" y="19" width="6" height="2.5" rx="0.5" fill="#60a5fa"/>
</svg>
